name: Integration

env:
  # Need to enable these to guarantee idempotence
  SHARED_FORMATTER_OPTS: "--ignore-config --v2-stable-multiline-strings=true --conditional-to-if=false --pipe-to-function-call=false"

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            version: '1.12'
            opts: '--style=default'
          - name: default-indentbin
            version: '1.12'
            opts: '--style=default --indent-binary-continuations=true'
          - name: "(expected fail) default-jlbos"
            version: '1.12'
            opts: '--style=default --join-lines-based-on-source=true'
          - name: default-pre
            version: 'pre'
            opts: '--style=default'
          - name: blue
            version: '1.12'
            opts: '--style=blue'
          - name: "(expected fail) yas"
            version: '1.12'
            opts: '--style=yas'
          - name: minimal
            version: '1.12'
            opts: '--style=minimal'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          path: formatter
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # 3.0.2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # 3.1.0

      # `pristine` holds the clones exactly as they came from GitHub and is
      # never written to by the formatter
      - name: Cache pristine target repos
        id: cache-repos
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: pristine
          key: repos-${{ github.run_id }}
          restore-keys: |
            repos-

      - name: Clone target repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for org in JuliaLang JuliaPlots MakieOrg SciML JuliaDiff JuliaStats TuringLang EnzymeAD jump-dev trixi-framework oscar-system; do
            for name in $(gh repo list "$org" --limit 1000 --json name,isFork,pushedAt --jq '.[] | select(((.name | endswith(".jl")) or .name == "julia") and (.isFork | not) and (.pushedAt >= "2024-01-01")) | .name'); do
              dest="pristine/$org/$name"
              [[ -d "$dest" ]] && continue
              echo "Cloning $org/$name ..."
              git clone --depth 1 --quiet "https://github.com/$org/$name" "$dest"
            done
          done

      - name: Remove unparseable files
        shell: julia --color=yes --project=formatter {0}
        run: |
          using Pkg
          Pkg.instantiate()

          using JuliaSyntax: parseall, GreenNode
          for (root, _, files) in walkdir("pristine")
            for f in files
              endswith(f, ".jl") || continue
              path = joinpath(root, f)
              try
                parseall(GreenNode, read(path, String); ignore_warnings=true)
              catch
                println("Removing unparseable file: $path")
                rm(path)
              end
            end
          end

      # Do all the work in a separate directory to avoid clobbering the clones
      # and accidentally caching formatted files
      - name: Copy target repos
        run: cp -a pristine target

      - name: Count Julia files and lines
        run: |
          files=$(find target -name '*.jl' -type f | wc -l)
          lines=$(find target -name '*.jl' -type f -print0 | xargs -0 cat | wc -l)
          echo "Formatting $files files, $lines lines of Julia"

      - name: Format (pass 1)
        working-directory: target
        run: |
          julia --project=../formatter -m JuliaFormatter --inplace ${{ matrix.opts }} ${{ env.SHARED_FORMATTER_OPTS }} .

      - name: Check idempotence (pass 2)
        working-directory: target
        run: |
          julia --project=../formatter -m JuliaFormatter --check --diff ${{ matrix.opts }} ${{ env.SHARED_FORMATTER_OPTS }} .
